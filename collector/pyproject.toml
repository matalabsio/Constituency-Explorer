[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kurupam-collector"
version = "0.1.0"
description = "Robots-aware collector for Kurupam public-source data"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
]

[project.scripts]
kurupam-collector = "kurupam_collector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kurupam_collector*"]
